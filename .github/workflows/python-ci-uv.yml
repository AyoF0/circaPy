name: Python CI using uv 

on: 
  push:
    branches:
      - main
      - development
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with: 
          version: "0.10.4"
     
      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Cache matplotlib font cache
        uses: actions/cache@v4
        with:
          path: /tmp/matplotlib-cache
          key: matplotlib-font-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            matplotlib-font-cache-${{ runner.os }}-

      - name: Test with makefile
        shell: bash
        env:
          MPLCONFIGDIR: /tmp/matplotlib-cache
        run: |
          make test
