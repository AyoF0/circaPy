[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "circaPy"
authors = [
    {name = "Angus Fisk", email = "angus_fisk@hotmail.com"},
    ]
version = "0.1.6"
description = "For analysing circadian activity data"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["circadian"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS"
    ]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "pingouin",
    "astropy",
    "pytest>=9.0.2",
]

[project.urls]
Homepage = "https://github.com/A-Fisk/circaPy"
Issues = "https://github.com/A-Fisk/circaPy/issues"

[dependency-groups]
dev = [
    "ipython>=9.9.0",
    "ruff>=0.15.2",
]
docs = [
    "sphinx>=8.0",
    "pydata-sphinx-theme>=0.16",
    "sphinx-autodoc-typehints>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/"]
addopts = "-v --tb=short"
python_files = "*_tests.py"
